<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Profile Finder</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { font-size: 1.4rem; margin-bottom: 16px; text-align: center; }
        input { width: 100%; padding: 14px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 10px; margin-bottom: 12px; font-size: 1rem; outline: none; }
        input:focus { border-color: #3b82f6; }
        button { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:active { background: #1d4ed8; }
        .results { margin-top: 20px; border-top: 1px solid #334155; padding-top: 16px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .label { color: #94a3b8; }
        .value { font-weight: 600; color: #f1f5f9; }
        .error { color: #f87171; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>TikTok Profile Finder</h2>
        <input type="text" id="username" placeholder="Enter username (no @)">
        <button onclick="searchUser()">Search Profile</button>
        <div id="output"></div>
    </div>

    <script>
        async function searchUser() {
            const input = document.getElementById('username').value.trim();
            const output = document.getElementById('output');
            if (!input) return;
            
            output.innerHTML = "<p style='margin-top:16px; text-align:center; color:#94a3b8;'>Searching profile...</p>";
            
            try {
                const res = await fetch(`/api/search?username=${encodeURIComponent(input)}`);
                const data = await res.json();
                
                if (data.error) {
                    output.innerHTML = `<p class="error">${data.error}</p>`;
                } else {
                    output.innerHTML = `
                        <div class="results">
                            <div class="row"><span class="label">Name:</span> <span class="value">${data.nickname}</span></div>
                            <div class="row"><span class="label">Region:</span> <span class="value">${data.region}</span></div>
                            <div class="row"><span class="label">Last Video:</span> <span class="value">${data.last_active}</span></div>
                            <div class="row"><span class="label">Followers:</span> <span class="value">${Number(data.followers).toLocaleString()}</span></div>
                            <div class="row"><span class="label">Following:</span> <span class="value">${Number(data.following).toLocaleString()}</span></div>
                        </div>
                    `;
                }
            } catch (e) {
                output.innerHTML = `<p class="error">Request failed. Try again.</p>`;
            }
        }
    </script>
</body>
</html>
